[Login]
# Fix: lid close with external monitor (HDMI-1 + eDP-1) was suspending -> killing wlo1
# Default: HandleLidSwitch=suspend -> suspends even with HDMI, not considered "Docked"
# Set to ignore so lid close keeps network + external monitor alive (like Windows/Ubuntu also)
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
LidSwitchIgnoreInhibited=no
IdleAction=ignore
